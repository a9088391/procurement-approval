# 效能量測使用獨立網路與可拋棄資料庫，沿用正式 API 映像。
name: procurement-approval-benchmark

services:
  benchmark-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: procurement_benchmark
      POSTGRES_USER: procurement_benchmark
      # 此測試庫無對外連接埠，tmpfs 隨容器停止清除。
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U procurement_benchmark -d procurement_benchmark"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  benchmark-app:
    build:
      context: .
      target: backend-runtime
    environment:
      ConnectionStrings__Database: Host=benchmark-db;Database=procurement_benchmark;Username=procurement_benchmark
      LocalDirectory: /tmp/procurement-benchmark
      Logging__LogLevel__Default: Warning
    depends_on:
      benchmark-db:
        condition: service_healthy

  benchmark:
    image: mcr.microsoft.com/dotnet/sdk:10.0.403
    environment:
      DOTNET_NOLOGO: "1"
    volumes:
      - ./global.json:/workspace/global.json:ro
      - ./backend:/workspace/backend:ro
      - ./tests:/workspace/tests:ro
    depends_on:
      benchmark-app:
        condition: service_started
    # 只將來源複製到容器內，避免量測改動宿主端的建置產物。
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$1" in Load|Csv) ;; *) exit 2 ;; esac
        mkdir /src
        tar -C /workspace --exclude=bin --exclude=obj --exclude=TestResults -cf /tmp/source.tar global.json backend tests
        tar -C /src -xf /tmp/source.tar
        cd /src
        dotnet restore tests/Procurement.IntegrationTests.csproj --locked-mode
        exec dotnet test tests/Procurement.IntegrationTests.csproj -c Release --no-restore \
          -p:RunPerformanceBenchmarks=true --filter "FullyQualifiedName=Procurement.Benchmarks.RequisitionBenchmarkTests.$$1" \
          --logger "console;verbosity=detailed"
      - --
    command: ["Load"]
